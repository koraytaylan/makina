# Makina — project configuration (`makina.toml`)
#
# This is the *project* layer of Makina's two-layer config (see
# `crates/makina-core/src/config.rs` and `docs/spec/runtime-artifact-schema.md`).
# It is committed to version control because it is repository-specific: it pins
# the base branch every task branches off and the toolchain-specific quality
# gates a task must pass before it can be reviewed and squash-merged.
#
# The *global* layer (`~/.makina/config.toml`, machine-specific, NOT committed)
# supplies the agent backend command, the Planner model/mechanism, and the
# default termination caps. The project layer wins on merge.
#
# Makina auto-detects a supported agent CLI on $PATH (gemini, claude-code-acp, grok,
# and others — see the README compatibility matrix) and uses it as the default backend — no
# global config is required if a supported
# agent is installed. To override the auto-detected default, or to set up Makina
# when no supported agent is on PATH, open Makina and press 'w' in the Doctor overlay
# to write a starter global config for your machine. See `docs/trial/e2e-run.md` for
# the full setup + run recipe.

# The durable base selected for plan registration and finalization. Task
# landings first enter the retained plan ref through coordinator-owned A/B
# commits; P/F/C then integrate and complete the plan onto this branch.
base_branch = "develop"

# How many tasks may run concurrently (each in its own worktree). Default 2 is a
# first-timer-safe ceiling: each gate pass compiles the whole workspace and agent
# turns drive real model calls, so a high value raises machine load and merge-lock
# contention. Raise it once you trust the run on this machine.
concurrency = 2

# Termination caps (project overrides of the global defaults). Generous on
# iterations because a real agent may need a couple of rounds to make the gates
# pass; bounded wall-clock so a wedged task cannot run forever. A full workspace
# `cargo` compile from cold plus several agent turns can take a while, hence the
# 20-minute ceiling.
[caps]
gate_iterations     = 5
reviewer_iterations = 3
wall_clock_secs     = 1200

# ── Quality gates ────────────────────────────────────────────────────────────
#
# Each gate is a shell command run (via `sh -c`) in the task's worktree. A gate
# "passes" iff it exits 0. They are evaluated top-to-bottom; the first failure
# is fed back to the Developer agent to fix, then ALL gates are re-run from the
# top on the next iteration. These are the same three checks this project's
# contribution hygiene requires, so a task that passes them is genuinely
# mergeable.

[[gates]]
name    = "test"
command = "cargo test"

[[gates]]
name    = "clippy"
command = "cargo clippy -- -D warnings"

[[gates]]
name    = "fmt"
command = "cargo fmt --check"
