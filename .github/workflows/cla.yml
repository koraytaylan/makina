# CLA-assistant (lite) — records contributor sign-off on the Makina CLA.
#
# This runs only once the repository is hosted on GitHub at koraytaylan/makina.
#
# It stores signatures in this repo at .github/cla/signatures.json (created
# automatically on first sign). To store them elsewhere, set
# `remote-organization-name` / `remote-repository-name` and provide a
# PERSONAL_ACCESS_TOKEN secret. Docs: https://github.com/contributor-assistant/github-action
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/koraytaylan/makina/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'koraytaylan,dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before we can merge it, please read our
            [Contributor License Agreement](CLA.md) and sign it by posting the
            following comment on this PR:
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA.'
