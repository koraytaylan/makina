[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85" # edition-2024 floor; the toolchain is pinned separately in rust-toolchain.toml
description = "Makina — a multi-agent software-factory orchestrator (ratatui TUI)"
repository = "https://github.com/koraytaylan/makina"
homepage = "https://github.com/koraytaylan/makina"
keywords = ["cli", "tui", "agent", "orchestrator", "automation"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Koray Taylan Davgana"]
# Source-available (NOT OSI open source). See LICENSE. A crate intended as a
# freely-embeddable SDK/client may override this with `license = "Apache-2.0"`.
license = "Elastic-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal", "test-util"] }

# TUI
ratatui = "0.30"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Config / data format
toml = "1.1"

# JSON serialization (artifact format for .tasks/*.json)
serde_json = "1.0"

# Date/time with serde support (RFC3339 timestamps in task artifacts)
chrono = { version = "0.4", features = ["serde"] }

# Object-safe async traits (needed for Box<dyn AgentBackend> / Box<dyn AgentSession>)
async-trait = "0.1"

# Stream / futures combinators — provides the Stream trait used in ResponseStream
futures = "0.3"

# tokio-stream — `ReceiverStream` adapts a tokio mpsc receiver into a `Stream`
# (used by the ACP backend to bridge a borrowing PromptStream to an owned
# ResponseStream over an mpsc channel).
tokio-stream = "0.1"

# tokio-util — `CancellationToken` is used by `CoreApi` (task 31, run-control)
# to signal a background Supervisor scheduler to abort (cancel) a Run.
tokio-util = "0.7"

# Platform-specific directories (home dir, config dirs, etc)
dirs = "5.0"

# Derive-based error types
thiserror = "2.0"

# Structured logging / diagnostics
tracing = "0.1"

# Tracing subscriber + non-blocking file appender (per-run file log layer).
# The TUI binary installs the subscriber once at startup; the custom file layer
# routes each event to `.makina/runs/{run_uid}/logs/` by the current span's
# `run_uid` field (see `crates/makina/src/log.rs`).
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-appender = "0.2"

# Internal crates
makina-core = { path = "crates/makina-core" }
makina-acp = { path = "crates/makina-acp" }
