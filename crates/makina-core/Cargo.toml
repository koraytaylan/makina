[package]
name = "makina-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Makina orchestration core: Tokio scheduler, task lifecycle, worktree manager, config, and agent-backend trait"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
cap-std = { workspace = true }
cap-fs-ext = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# `sync` feature provides `BroadcastStream`, used by `orchestrator::CoreApi` to
# adapt a `tokio::sync::broadcast` receiver into the infallible `EventStream`.
tokio-stream = { workspace = true, features = ["sync"] }
# `tokio-util` provides `CancellationToken`, used by `orchestrator::CoreApi`
# (task 31, run-control) to signal a background Supervisor scheduler to abort.
tokio-util = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# `ulid` mints the persistent, sortable 26-char run identity (`run_uid`) stamped
# on every Run when it is opened (mk-run-id).  The lexicographic order of the
# string matches chronological order, giving a stable cross-process run key.
ulid = "1"
tempfile = { version = "3", optional = true }

[dev-dependencies]
# `per_task_logs.rs` installs a span-field routing tracing layer (mirroring the
# `makina` binary's `RunFileLayer`, which lives downstream and cannot be imported
# here) to assert that a task driver's `task_slug` span routes its records to the
# task's log file.
tracing-subscriber = { workspace = true }
makina-core = { path = ".", features = ["test-support"] }

[features]
test-support = ["dep:tempfile"]
