[package]
name = "makina-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Makina orchestration core: actor topology, task lifecycle, worktree manager, config, and agent-backend trait"

[dependencies]
tokio = { workspace = true }
kameo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# `sync` feature provides `BroadcastStream`, used by `orchestrator::CoreApi` to
# adapt a `tokio::sync::broadcast` receiver into the infallible `EventStream`.
tokio-stream = { workspace = true, features = ["sync"] }
# `tokio-util` provides `CancellationToken`, used by `orchestrator::CoreApi`
# (task 31, run-control) to signal a background Supervisor scheduler to abort.
tokio-util = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
