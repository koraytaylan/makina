[package]
name = "makina"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Makina — multi-agent software-factory orchestrator (ratatui TUI entry point)"

[[bin]]
name = "makina"
path = "src/main.rs"

[features]
# Exposes the event loop's private `resolve_io` IO-resolution step as
# `event::resolve_io_for_test` so integration tests under `tests/` (which
# compile as a separate crate, without `cfg(test)`) can drive real
# `AppEvent`s (`OpenFolderSelected`, `CloseFolderConfirmed`,
# `InitializeFolderSelected`, …) through the actual wiring instead of
# mutating `App` fields directly. Off by default; production builds never
# compile the seam.
test-util = []

[dependencies]
makina-core = { workspace = true }
makina-acp = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = { workspace = true }
async-trait = { workspace = true }
ratatui = { workspace = true }
# Direct crossterm dependency to enable the `event-stream` feature (async input events).
# ratatui re-exports crossterm but does not enable event-stream in its feature flags.
crossterm = { version = "0.29", features = ["event-stream"] }
# Structured logging / per-run file log layer (task log-subscriber-file).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
# Compatibility pin for ratatui-widgets 0.3.x: time 0.3.48 introduced a
# coherence conflict with its blanket From<T> impls during fresh installs.
time = "=0.3.47"
pulldown-cmark = { version = "0.12", default-features = false }
ansi-to-tui = "8"
syntect = { version = "5.3", default-features = false, features = ["parsing", "fancy-regex", "metadata"] }
two-face = "0.2"
# JSON serialization for replay module (reading transcripts)
serde_json = { workspace = true }
# Chrono for DateTime<Utc> / Utc::now() in the Gantt Timeline render.
chrono = { workspace = true }
# TOML serialization for writing provider/role config back to disk (task 0041)
toml = { workspace = true }
serde = { workspace = true }
# Home directory resolution for workspace persistence
dirs = { workspace = true }

[dev-dependencies]
# Temporary files/dirs for the file-browser IO + TUI↔CoreApi flow tests.
tempfile = "3"
# Enable the reaper's process-registry test seam so the exit-cleanup tests
# (`exit.rs`, `tests/`) can register a fake agent pgid, install a recording kill
# stub, and assert the registry is drained — without signalling real processes.
makina-acp = { workspace = true, features = ["test-util"] }
# Hermetic git test helpers (run_git, setup_temp_repo).
makina-core = { workspace = true, features = ["test-support"] }
# Self-referential dev-dependency: enables this crate's own `test-util`
# feature (exposing `event::resolve_io_for_test`) for the `tests/` integration
# binaries, which compile against `makina` as an external dependency and so
# never see `#[cfg(test)]`-gated items.
makina = { path = ".", features = ["test-util"] }
