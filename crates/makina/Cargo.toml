[package]
name = "makina"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Makina — multi-agent software-factory orchestrator (ratatui TUI entry point)"

[[bin]]
name = "makina"
path = "src/main.rs"

[dependencies]
makina-core = { workspace = true }
makina-acp = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = { workspace = true }
async-trait = { workspace = true }
ratatui = { workspace = true }
# Direct crossterm dependency to enable the `event-stream` feature (async input events).
# ratatui re-exports crossterm but does not enable event-stream in its feature flags.
crossterm = { version = "0.29", features = ["event-stream"] }
# Structured logging / per-run file log layer (task log-subscriber-file).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
pulldown-cmark = { version = "0.12", default-features = false }
ansi-to-tui = "8"
# JSON serialization for replay module (reading transcripts)
serde_json = { workspace = true }
# TOML serialization for writing provider/role config back to disk (task 0041)
toml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Temporary files/dirs for the file-browser IO + TUI↔CoreApi flow tests.
tempfile = "3"
# Enable the reaper's process-registry test seam so the exit-cleanup tests
# (`exit.rs`, `tests/`) can register a fake agent pgid, install a recording kill
# stub, and assert the registry is drained — without signalling real processes.
makina-acp = { workspace = true, features = ["test-util"] }
