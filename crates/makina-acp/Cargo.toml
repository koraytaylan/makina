[package]
name = "makina-acp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ACP (agent client protocol) backend implementation for Makina — subprocesses an ACP-compatible CLI over stdio"

[features]
# Exposes the reaper's process-registry test seam (`register_for_test`,
# `set_kill_fn_for_test`, `registered_pgids_for_test`) as public `#[doc(hidden)]`
# helpers so downstream crates (notably the `makina` TUI binary) can drive the
# exit-cleanup path in their own tests without signalling real processes. Off by
# default; production builds never compile the seam.
test-util = []

[dependencies]
makina-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
tokio-util = "0.7"
async-trait = { workspace = true }
chrono = { workspace = true }
